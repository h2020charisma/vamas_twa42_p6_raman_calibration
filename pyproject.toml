[project]
name = "vamas_twa42_p6_raman_calibration"
version = "1.0.0"
description = "Data analysis for VAMAS Project 06 Protocols for Raman instrument calibration and harmonisation of Raman data"
license = "MIT"
authors = [
    { name = "Nina Jeliazkova", email = "jeliazkova.nina@gmail.com" },
]
readme = "README.md"
maintainers = [
    { name = "Luchesar Iliev", email = "luchesar.iliev@gmail.com" },
    { name = "Vedrin Jeliazkov", email = "vedrin.jeliazkov@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "emd~=0.7.0",
    "h5pyd~=0.18.0",
    "h5py~=3.10.0",
    "jupyter~=1.0.0",
    "nexusformat~=1.0.4",
    "numcompress~=0.1.2",
    "numpy~=1.26.4",
    "openpyxl~=3.1.5",
    "ploomber~=0.23.2",
    "pyambit>=0.0.2",
    "pynanomapper~=2.1.0",
    "ramanchada2~=1.3.1",
    "requests~=2.31.0",
    "scikit-learn~=1.4.2",
    "scipy~=1.11.4",
    "tables~=3.9.2",
]

[project.urls]
homepage = "https://www.vamas.org/twa42/documents/2024_vamas_twa42_p6_raman_calibration.pdf"
repository = "https://github.com/h2020charisma/vamas_twa42_p6_raman_calibration"

[tool.uv.sources]
ramanchada2 = { path = "../ramanchada2", editable = true }

