# Example env for the CWA 18134 twinning pipeline (see src/pipeline.twinning.yaml).
# Copy to src/env.yaml (or pass with -e) and CHANGEIT the paths.
#
# NOTE: config_root/config_output and fit_ne_peaks/match_mode/interpolator MUST
# match your main-pipeline run, so already-built products (incl. the calmodels
# consumed by twinning) are reused instead of rebuilt.

# This file will be expected in the config_root folder
config_templates: "config_pipeline.json"

config_root: "CHANGEIT\\Nextcloud\\Projects\\CHARISMA\\Data Raman RR1"
config_output: "CHANGEIT\\Nextcloud\\Projects\\CHARISMA\\Data Raman RR1\\output"

report_format: "html"

# keep identical to the main pipeline run (product-path cache reuse)
fit_ne_peaks: True
match_mode: "qargmin2d"
interpolator: "poly"

# calibrant sample tags (adjust to the participant templates)
ne_tag: "Neon"
si_tag: "S0B"
pst_tag: "PST"
apap_tag: "APAP"
calcite_tag: "CAL"

# --- CWA 18134 twinning (docs/cwa18134_summary.md) ---
# single configured reference participant (RI_R)
twinning_reference_key: "P6_01201"
# participants to twin against the reference — MUST include the reference key
# (the load/x-cal grid fans out over this list; twinning.py excludes the
# reference itself from the twinned side)
twinning_keys:
  - "P6_01201"
  - "P6_0601"
  - "P6_01202"
# TiPS (epoxy + 0.5 wt% anatase TiO2) sample tag in the templates;
# one tag per run ("TiPS_Ti" or "TiPS_PS")
tips_sample_tag: "TiPS_Ti"
# reference Raman band (RRB), cm-1: TiO2 144 (638 fallback if the low end cuts off)
twinning_rrb: 144
# spectral boundaries for trim/area, cm-1
twinning_boundaries: [50, 2000]
# CWA 18134 §6.2 minimum distinct laser powers per instrument
twinning_min_powers: 5
# pairing tolerance on laser_power_percent (reserved; 0 = exact matching)
twinning_power_tolerance: 0.0
# CWA §6.5 recommended validation: 2 extra laser powers (%), excluded from the
# fit and verified with the CF afterwards; empty list disables it
twinning_validation_powers: []
